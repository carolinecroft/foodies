<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Preview</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-container">

        <article class="profile-card">

            <!-- Profile photo -->
            <img
                src="profile.jpg"
                alt="Profile photo of Alex"
                class="profile-photo"
            >

            <!-- Profile information -->
            <section class="profile-info">

                <header>
                    <h1>Alex, 24</h1>
                    <p class="location">Orlando, FL</p>
                </header>

                <!-- Bio -->
                <section class="bio">
                    <h2>About Me</h2>
                    <p>
                        Coffee enthusiast, concert lover, and always
                        looking for somewhere new to travel.
                    </p>
                </section>

                <!-- Interests -->
                <section class="interests">
                    <h2>Interests</h2>

                    <span>Music</span>
                    <span>Travel</span>
                    <span>Photography</span>
                    <span>Coffee</span>
                </section>

            </section>

            <!-- Profile actions -->
            <footer class="profile-actions">
                <button type="button" class="dislike-button">
                    ✕
                </button>

                <button type="button" class="like-button">
                    ♥
                </button>
            </footer>

        </article>

    </main>

</body>
</html>
