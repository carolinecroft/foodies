{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Foodies{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

    <header>
        <div class="header-content">
            <h1>Foodies</h1>

            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                <a href="{% url 'profile_setup' %}" class="{% if request.resolver_match.url_name == 'profile_setup' %}active{% endif %}">Create Profile</a>
                <a href="{% url 'food_preferences' %}" class="{% if request.resolver_match.url_name == 'food_preferences' %}active{% endif %}">Food Preferences</a>
                <a href="{% url 'profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">My Profile</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
